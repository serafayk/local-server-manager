[package]
name = "local-server-manager"
version = "0.14.0"
description = "Gerenciador local de projetos Node.js"
authors = ["Local Server Manager"]
edition = "2021"

[lib]
name = "local_server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
